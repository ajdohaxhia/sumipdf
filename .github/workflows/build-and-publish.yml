name: Build and Push Sumi PDF Images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  HUSKY: 0

jobs:
  image:
    if: github.repository == 'ajdohaxhia/sumipdf'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        mode:
          - name: default
            simple_mode: false
            suffix: ''
          - name: simple
            simple_mode: true
            suffix: '-simple'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Container metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}${{ matrix.mode.suffix }}
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha

      - name: Build and push ${{ matrix.mode.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SIMPLE_MODE=${{ matrix.mode.simple_mode }}
            SITE_URL=${{ vars.SITE_URL }}
          cache-from: type=gha,scope=${{ matrix.mode.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.mode.name }}

  release-artifacts:
    if: github.repository == 'ajdohaxhia/sumipdf' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Verify release build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          VITE_SITE_URL: ${{ vars.SITE_URL }}
        run: |
          npm run lint
          npm run typecheck
          npm run test:run
          npm run security:patterns
          npm run build

      - name: Package distribution
        run: npm run package

      - name: Publish release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: dist-*.zip
          generate_release_notes: true
