name: Bug report
description: Report a bug in Sumi PDF
title: "(Bug) "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do **not** attach confidential PDFs. Recreate the issue with a synthetic file when you can.

  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options:
        - Home / search
        - Merge
        - Organize
        - Compress
        - Sign
        - Privacy Clean
        - Redact
        - Workflow Builder
        - Other
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Merge
        2. Choose two synthetic PDFs
        3. …
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Other
    validations:
      required: true

  - type: input
    id: browser-version
    attributes:
      label: Browser version
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Console errors
      description: Paste text, not screenshots of secrets.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: confidential
    attributes:
      label: Files
      options:
        - label: I will not upload confidential documents to this issue
          required: true
