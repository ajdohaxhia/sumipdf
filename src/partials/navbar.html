{{#if simpleMode}} {{> navbar-simple}} {{else}}
<a class="sumi-skip skip-link" href="#main-content">Skip to content</a>
<header class="sumi-header">
  <div class="sumi-header__inner">
    <a class="sumi-logo" href="index.html" id="home-logo">
      <img
        id="nav-logo"
        src="{{baseUrl}}{{#if brandLogo}}{{brandLogo}}{{else}}images/logo-mark.svg{{/if}}"
        alt="{{#if brandName}}{{brandName}}{{else}}Sumi PDF{{/if}}"
        width="28"
        height="28"
      />
      <span id="nav-brand" class="sumi-logo__word"
        >{{#if brandName}}{{brandName}}{{else}}Sumi PDF{{/if}}</span
      >
    </a>
    <nav class="sumi-nav" aria-label="Primary">
      <a href="workspace.html" data-i18n="nav.workspace">Workspace</a>
      <a href="workspace.html#inspect" data-i18n="nav.inspect">Inspect</a>
      <a href="workspace.html#flow" data-i18n="nav.flow">Flow</a>
      <a href="workspace.html#proof" data-i18n="nav.proof">Proof</a>
      <a href="tools.html" data-i18n="nav.tools">Tools</a>
      <a href="recipes.html" data-i18n="nav.recipes">Recipes</a>
      <a href="privacy.html" data-i18n="nav.privacy">Privacy</a>
      <a href="{{repoUrl}}" rel="noopener noreferrer" data-i18n="nav.source"
        >Open source</a
      >
    </nav>
    <div class="sumi-header__actions">
      <span class="sumi-privacy-pill" data-i18n="nav.localBadge"
        >Processed on this device</span
      >
      <button
        type="button"
        class="sumi-icon-btn"
        data-open-command
        aria-keyshortcuts="Control+K Meta+K"
        data-i18n-aria="command.open"
      >
        <span class="sr-only" data-i18n="command.open">Search tools</span>
        <i data-lucide="search" class="w-4 h-4"></i>
      </button>
      <div id="sumi-theme-switcher"></div>
      <div id="sumi-language-slot"></div>
      <button
        id="mobile-menu-button"
        type="button"
        class="sumi-icon-btn"
        aria-controls="mobile-menu"
        aria-expanded="false"
      >
        <span class="sr-only" data-i18n="nav.openMainMenu">Open main menu</span>
        <svg
          id="menu-icon"
          class="block h-5 w-5"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.6"
            d="M4 7h16M4 12h16M4 17h16"
          />
        </svg>
        <svg
          id="close-icon"
          class="hidden h-5 w-5"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.6"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>
  </div>
  <div id="mobile-menu" class="hidden border-t border-rule">
    <div class="px-4 py-3 space-y-1">
      <a href="workspace.html" class="mobile-nav-link" data-i18n="nav.workspace"
        >Workspace</a
      >
      <a
        href="workspace.html#inspect"
        class="mobile-nav-link"
        data-i18n="nav.inspect"
        >Inspect</a
      >
      <a href="workspace.html#flow" class="mobile-nav-link" data-i18n="nav.flow"
        >Flow</a
      >
      <a
        href="workspace.html#proof"
        class="mobile-nav-link"
        data-i18n="nav.proof"
        >Proof</a
      >
      <a href="tools.html" class="mobile-nav-link" data-i18n="nav.tools"
        >Tools</a
      >
      <a href="recipes.html" class="mobile-nav-link" data-i18n="nav.recipes"
        >Recipes</a
      >
      <a href="privacy.html" class="mobile-nav-link" data-i18n="nav.privacy"
        >Privacy</a
      >
      <a href="{{repoUrl}}" class="mobile-nav-link" data-i18n="nav.source"
        >Open source</a
      >
    </div>
  </div>
</header>
<div id="sumi-live-status" class="sr-only" aria-live="polite"></div>
{{/if}}
