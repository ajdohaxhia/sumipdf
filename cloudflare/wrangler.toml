name = "sumi-pdf-cors-proxy"
main = "cors-proxy-worker.js"
compatibility_date = "2026-03-01"

# Optional certificate CORS proxy for digital signatures.
# Documents never pass through this worker.
#
# Deploy from repo root:
#   npm run deploy:cors-proxy
# or:
#   npx wrangler deploy -c cloudflare/wrangler.toml
#
# Configure allowed browser origins (comma-separated HTTPS origins):
#   npx wrangler secret put ALLOWED_ORIGINS -c cloudflare/wrangler.toml
# Example value:
#   https://sumi.yourdomain.com,https://sumi-pdf.pages.dev
#
# Optional HMAC:
#   openssl rand -hex 32 | npx wrangler secret put PROXY_SECRET -c cloudflare/wrangler.toml
#
# Rate limiting (recommended): create your own KV namespace, then set the id below.
#   npx wrangler kv namespace create "RATE_LIMIT_KV" -c cloudflare/wrangler.toml

# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# [vars]
# ALLOWED_ORIGINS = "https://sumi-pdf.pages.dev"
