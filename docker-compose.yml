services:
  sumi-pdf:
    # Build this fork locally. A future published image should use
    # ghcr.io/ajdohaxhia/sumipdf; never pull the upstream commercial image here.
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-}
    container_name: sumi-pdf
    restart: unless-stopped
    ports:
      - '8080:8080'
    # For IPv4-only environments
    #environment:
    #  - DISABLE_IPV6=true
